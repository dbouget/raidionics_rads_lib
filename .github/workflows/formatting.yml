name: Python Code Formatting

on:
  pull_request:
  push:
    branches: [main]

jobs:
  format:
    name: Format Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install flake8 isort black

      - name: Run formatting
        run: sh shell/format.sh